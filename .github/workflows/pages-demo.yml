name: BESI Marketplace Safe Demo (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "design-preview/**"
      - "scripts/test-design-preview.js"
      - ".github/workflows/pages-demo.yml"
  workflow_dispatch:

concurrency:
  group: "besi-marketplace-demo"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and QA isolated storefront demo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HAS_CF_DEPLOY_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless browser test library
        run: npm ci --ignore-scripts
      - name: Verify actual BESI storefront scripts
        run: npm run test:ui
      - name: Build isolated demo from synthetic catalog ONLY
        run: |
          set -euo pipefail
          mkdir -p .pages-preview-dist
          cp design-preview/index.html .pages-preview-dist/index.html
          node --check scripts/test-design-preview.js
          test "$(find .pages-preview-dist -type f | wc -l)" -eq 1
          ! grep -Eiq 'dropbuy|cnlg|wholesale_price|supplier_cost|source_url|api_image' .pages-preview-dist/index.html
      - name: Headless Chrome QA: desktop, mobile, filters, cart, safety
        run: node scripts/test-design-preview.js
      - name: Save actual desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: besi-marketplace-demo-screenshots
          path: preview-test-artifacts
          if-no-files-found: warn
      # Deploy ONLY the single-file demo. Never deploy the private source catalog,
      # admin screens, credentials, or production storefront/server code.
      - name: Publish isolated demo to Cloudflare Pages
        if: env.HAS_CF_DEPLOY_CREDS == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create besi-trungbay --production-branch=main || true
          command: pages deploy .pages-preview-dist --project-name=besi-trungbay --branch=main --commit-dirty=true
