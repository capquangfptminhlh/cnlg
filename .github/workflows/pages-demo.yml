name: GitHub Pages Storefront Demo

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/pages-preview.js"
      - "scripts/build-pages-preview.js"
      - ".github/workflows/pages-demo.yml"
  workflow_dispatch:

concurrency:
  group: "pages-storefront-demo"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Package safe static storefront
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify existing storefront
        run: |
          npm run test:ui
          node --check scripts/pages-preview.js
          node --check scripts/build-pages-preview.js
      - name: Build Pages artifact (synthetic catalog only)
        run: |
          node scripts/build-pages-preview.js
          for file in .pages-preview-dist/*.js; do node --check "$file"; done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-preview-dist

  deploy:
    name: Publish GitHub Pages preview
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy public-safe demo
        id: deployment
        uses: actions/deploy-pages@v4
