name: Storefront Demo (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/pages-preview.js"
      - "scripts/build-pages-preview.js"
      - "scripts/test-pages-preview.js"
      - "scripts/cache-preview-images.js"
      - ".github/workflows/pages-demo.yml"
  workflow_dispatch:

concurrency:
  group: "storefront-demo"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Package safe static storefront
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Verify existing storefront
        run: |
          npm run test:ui
          node --check scripts/pages-preview.js
          node --check scripts/build-pages-preview.js
      - name: Build Pages artifact (synthetic catalog only)
        run: |
          node scripts/build-pages-preview.js
          for file in .pages-preview-dist/*.js; do node --check "$file"; done
      - name: Cache safe public thumbnails
        run: node scripts/cache-preview-images.js
        env:
          CATALOG_IMAGE_LIMIT: "1321"
      - name: Run headless Chrome smoke tests
        run: node scripts/test-pages-preview.js
      - name: Upload desktop and mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-demo-screenshots
          path: preview-test-artifacts
          if-no-files-found: warn
      # Bản trưng bày công khai trên Cloudflare Pages (repo vẫn riêng tư). Cần 2 secret của repo:
      # CLOUDFLARE_API_TOKEN (quyền "Cloudflare Pages: Edit") và CLOUDFLARE_ACCOUNT_ID. Chưa có thì bỏ qua bước này.
      - name: Deploy demo to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create besi-trungbay --production-branch=main || true
          command: pages deploy .pages-preview-dist --project-name=besi-trungbay --branch=main --commit-dirty=true
