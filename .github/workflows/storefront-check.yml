name: Storefront quality checks
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.js'
      - 'services/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storefront-check.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'server.js'
      - 'services/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront:
    name: Unit and storefront tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:ui
