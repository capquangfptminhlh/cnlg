name: Storefront quality checks
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.js'
      - 'services/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storefront-check.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'server.js'
      - 'services/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront:
    name: Unit and storefront tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:ui

  windows-updater-parser:
    name: Parse BESI Windows updater with Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify updater syntax before accepting changes
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $filename = Join-Path (Get-Location) 'scripts/auto-update.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($filename, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            foreach ($issue in $parseErrors) { Write-Host ($issue.ToString()) }
            exit 1
          }
          Write-Host 'BESI Windows updater syntax valid'
