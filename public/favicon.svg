<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="hmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b45"/>
      <stop offset="55%" stop-color="#ee4d2d"/>
      <stop offset="100%" stop-color="#c93315"/>
    </linearGradient>
    <linearGradient id="hmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="hmShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7a1806" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#hmBg)"/>
  <rect x="7" y="7" width="114" height="114" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
  <!-- Shopping Bag Handle Arc -->
  <path d="M44 42 C44 25, 84 25, 84 42" fill="none" stroke="url(#hmGold)" stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="44" cy="44" r="4" fill="#ffd166"/>
  <circle cx="84" cy="44" r="4" fill="#ffd166"/>
  <!-- Bold HM Monogram -->
  <g filter="url(#hmShadow)" fill="#ffffff">
    <!-- H -->
    <path d="M22 52 H33 V71 H47 V52 H58 V98 H47 V81 H33 V98 H22 Z"/>
    <!-- M -->
    <path d="M64 52 H75 L85 73 L95 52 H106 V98 H95 V71 L85 91 H84 L75 71 V98 H64 Z"/>
  </g>
  <!-- Top-right Sparkle Star -->
  <path d="M101 22 L103.2 27.8 L109 30 L103.2 32.2 L101 38 L98.8 32.2 L93 30 L98.8 27.8 Z" fill="url(#hmGold)"/>
</svg>
